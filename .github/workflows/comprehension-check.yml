name: Comprehension Gate

on:
  pull_request:

# Needed for checkout and for creating a pull-request comment when review is required.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comprehension-check:
    name: Comprehension Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for unanswered comprehension questions
        id: gate
        run: python .github/scripts/check.py
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          GATE_SECRET: ${{ secrets.GATE_SECRET }}

      - name: Publish comprehension review links
        if: ${{ always() && steps.gate.outcome == 'failure' }}
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: ${{ github.workspace }}/.comprehension-gate-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            if (!fs.existsSync(process.env.COMMENT_FILE)) {
              core.warning("The gate failed before it could create review links.");
              return;
            }
            const body = fs.readFileSync(process.env.COMMENT_FILE, "utf8");
            await core.summary.addRaw(body).write();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
