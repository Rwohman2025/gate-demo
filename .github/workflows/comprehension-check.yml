name: Comprehension Gate

on:
  pull_request:

# Needed for checkout and for creating a pull-request comment when review is required.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comprehension-check:
    name: Comprehension Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for unanswered comprehension questions
        id: gate
        run: python .github/scripts/check.py
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          GATE_SECRET: ${{ secrets.GATE_SECRET }}

      - name: Post comprehension review links
        if: ${{ failure() && steps.gate.outputs.gate_status == 'fail' }}
        uses: actions/github-script@v7
        env:
          UNANSWERED: ${{ steps.gate.outputs.unanswered }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const unanswered = JSON.parse(process.env.UNANSWERED || "[]");
            const links = unanswered
              .filter(item => item.file_path && item.review_url)
              .map(item => `- [\`${item.file_path}\`](${item.review_url})`);
            const body = [
              "## Comprehension Gate",
              "",
              "This pull request has unanswered code-review questions:",
              "",
              ...links,
              "",
              "Open each link, answer the question, then push your update.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
